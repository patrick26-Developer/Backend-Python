# Config locale de la solution `shopfast`.
# Dépendances : dépôt racine (fastapi, sqlalchemy[asyncio], aiosqlite, pydantic-settings,
# pwdlib[argon2], pyjwt, httpx, pytest, pytest-asyncio, pytest-cov).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers --cov=shopfast --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = ["shopfast/__init__.py"]
# SQLAlchemy async exécute du code dans des greenlets : sans ça, la couverture des
# repositories/services est sous-estimée.
concurrency = ["thread", "greenlet"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
