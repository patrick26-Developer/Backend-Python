# Site de la formation — build : mkdocs build   /   preview : mkdocs serve
# Génère un site statique navigable et consultable hors ligne.
site_name: "Backend-Python — Maîtriser FastAPI"
site_description: "Formation complète : concevoir, développer, tester et exploiter des API FastAPI de niveau production."
site_author: "Patrick De Grâce"
copyright: "&copy; 2026 Patrick De Grâce — Contenu tous droits réservés (voir LICENSING.md)"

# On documente « en place » : les .md vivent à côté du code.
# Le plugin same-dir autorise docs_dir = dossier du mkdocs.yml.
docs_dir: .
site_dir: site

exclude_docs: |
  .venv/
  .github/
  .ruff_cache/
  .mypy_cache/
  .pytest_cache/
  site/
  node_modules/
  tests/
  **/taskman/
  **/alembic/
  **/solution/
  **/starter/
  CONTRIBUTING.md

not_in_nav: |
  LICENSE-CODE.txt
  LICENSE-CONTENT.txt

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Mode sombre }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Mode clair }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true, line_spans: __span }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji

plugins:
  - same-dir
  - search: { lang: fr }

nav:
  - Accueil: README.md
  - Mode d'emploi: GUIDE.md
  - Feuille de route: ROADMAP.md
  - Couverture de la doc FastAPI: DOC-COVERAGE.md
  - Licence: LICENSING.md
  - Sécurité: SECURITY.md
  - Annexes:
