# Render Blueprint — déploie le site complet de la formation (public, gratuit).
#
# Mise en place : https://dashboard.render.com  ->  New  ->  Blueprint  ->  choisir ce dépôt.

services:
  - type: web
    name: fastapi-formation-vitrine
    runtime: static
    buildCommand: pip install -r requirements-docs.txt && mkdocs build
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DISABLE_MKDOCS_2_WARNING
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
