# Render Blueprint — déploie le site VITRINE (public) de la formation.
#
# Ce blueprint ne construit QUE `mkdocs.showcase.yml` : accueil + mode d'emploi +
# Modules 00 et 01. Le reste du dépôt (contenu payant) n'est jamais copié dans le site
# publié, même si le dépôt Render est branché sur le dépôt privé complet.
#
# Mise en place : https://dashboard.render.com  ->  New  ->  Blueprint  ->  choisir ce dépôt.

services:
  - type: web
    name: fastapi-formation-vitrine
    runtime: static
    buildCommand: pip install -r requirements-docs.txt && mkdocs build -f mkdocs.showcase.yml
    staticPublishPath: ./site_showcase
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - showcase/**
        - 00-setup/**
        - 01-fondations-http-et-fastapi/**
        - GUIDE.md
        - mkdocs.showcase.yml
        - requirements-docs.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DISABLE_MKDOCS_2_WARNING
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
