# ============================================================================
#  taskman - projet fil rouge du cursus "Backend-Python / FastAPI"
#  taskman - the running project of the "Backend-Python / FastAPI" curriculum
# ============================================================================

[project]
name = "taskman"
version = "0.1.0"
description = "API de gestion de tâches - projet pédagogique FastAPI de niveau production"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Patrick De Grâce" }]

dependencies = [
    "fastapi[standard]>=0.141,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # Module 04+ : base de données
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "aiosqlite>=0.20,<0.22",       # driver async SQLite (dev, tests)
    "asyncpg>=0.30,<0.31",         # driver async PostgreSQL (staging/prod)
    # Module 06 : authentification
    "pwdlib[argon2]>=0.2.1,<0.3",  # hachage de mots de passe (argon2)
    "pyjwt>=2.10,<3.0",            # JSON Web Tokens
    # Module 08 : cache & tâches de fond
    "redis>=5.2,<6.0",            # client Redis async (cache)
    "taskiq>=0.11,<0.12",         # file de tâches async
    "taskiq-redis>=1.0,<2.0",     # broker Redis pour taskiq
]

[project.optional-dependencies]
# Installer avec :  pip install -e ".[dev]"
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    # Module 07 : tests d'intégration sur un vrai PostgreSQL (nécessite Docker).
    "testcontainers[postgres]>=4.8,<5.0",
]
# Site de la formation :  pip install -e ".[docs]"  puis  mkdocs serve
docs = [
    "mkdocs-material>=9.5,<10.0",
    "mkdocs-same-dir>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskman"]

# ----------------------------------------------------------------------------
#  Ruff : linter + formatter (remplace flake8 + isort + black)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["taskman", "tests"]
# Les supports de cours (.md) contiennent des extraits volontairement partiels
# ou illustratifs : on ne les soumet pas au formateur.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (tri des imports)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear (pièges courants)
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RUF",      # règles propres à ruff
]
ignore = ["B008"]  # B008: appel de fonction dans les valeurs par défaut -> voulu par FastAPI (Depends())

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.isort]
known-first-party = ["taskman"]

# ----------------------------------------------------------------------------
#  mypy : vérification de types statique
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
# La cible canonique est `mypy taskman`. Les dossiers de cours (NN-*) contiennent
# des modules homonymes (models.py, store.py...) d'un module à l'autre : on les
# vérifie séparément, dossier par dossier (voir le Makefile, cible `type-all`).
exclude = ['^\d\d-', '^alembic/']

# ----------------------------------------------------------------------------
#  pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: test lent (sous-processus, migrations) — exclure avec -m 'not slow'",
    "e2e: test de bout en bout nécessitant Docker (testcontainers) — exclure avec -m 'not e2e'",
]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["taskman"]
branch = true
omit = ["taskman/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# La CI échoue si la couverture passe sous ce seuil.
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]
