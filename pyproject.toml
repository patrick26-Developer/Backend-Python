# ============================================================================
#  taskman - projet fil rouge du cursus "Backend-Python / FastAPI"
#  taskman - the running project of the "Backend-Python / FastAPI" curriculum
# ============================================================================

[project]
name = "taskman"
version = "0.1.0"
description = "API de gestion de tâches - projet pédagogique FastAPI de niveau production"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Patrick De Grâce" }]

dependencies = [
    "fastapi[standard]>=0.141,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
# Installer avec :  pip install -e ".[dev]"
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskman"]

# ----------------------------------------------------------------------------
#  Ruff : linter + formatter (remplace flake8 + isort + black)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["taskman", "tests"]
# Les supports de cours (.md) contiennent des extraits volontairement partiels
# ou illustratifs : on ne les soumet pas au formateur.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (tri des imports)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear (pièges courants)
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RUF",      # règles propres à ruff
]
ignore = ["B008"]  # B008: appel de fonction dans les valeurs par défaut -> voulu par FastAPI (Depends())

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.isort]
known-first-party = ["taskman"]

# ----------------------------------------------------------------------------
#  mypy : vérification de types statique
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
# La cible canonique est `mypy taskman`. Les dossiers de cours (NN-*) contiennent
# des modules homonymes (models.py, store.py...) d'un module à l'autre : on les
# vérifie séparément, dossier par dossier (voir le Makefile, cible `type-all`).
exclude = ['^\d\d-']

# ----------------------------------------------------------------------------
#  pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette 1.x annonce la future bascule vers httpx2 pour son TestClient ;
    # on migre vers httpx.AsyncClient au Module 07.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["taskman"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
